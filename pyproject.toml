[project]
name = "zvex"
version = "0.1.6"
description = "zvex (声桥) MCP server — AI video dubbing: hand it a video URL or a local file and get back a dubbed video that keeps the original speakers' voices, billed via zvex credits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zvex" }]
keywords = ["mcp", "video", "dubbing", "translation", "tts"]
dependencies = [
    # 2.x 起 FastMCP 更名为 MCPServer(mcp.server.mcpserver),本包按 2.x API 编写
    "mcp>=2.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
zvex = "zvex.server:main"

[project.urls]
Homepage = "https://zvex.cn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zvex"]
